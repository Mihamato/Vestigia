<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Digital Clock</title>\n    <style>\n        body {\n            background-color: #1a1a1a;\n            color: #e5e5e5;\n            font-family: 'Arial', sans-serif;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            margin: 0;\n        }\n        .clock {\n            text-align: center;\n        }\n        .time {\n            font-size: 3em;\n            margin: 10px 0;\n        }\n        .timezone {\n            font-size: 1.2em;\n        }\n    </style>\n</head>\n<body>\n    <div class="clock">\n        <div class="time" id="utc">UTC: --:--:--</div>\n        <div class="timezone">\n            <div id="est">EST: --:--:--</div>\n            <div id="pst">PST: --:--:--</div>\n            <div id="cet">CET: --:--:--</div>\n            <div id="jst">JST: --:--:--</div>\n            <div id="aest">AEST: --:--:--</div>\n        </div>\n    </div>\n    <script>\n        function updateClocks() {\n            const now = new Date();\n            const utc = now.toUTCString().split(' ')[4];\n            document.getElementById('utc').textContent = 'UTC: ' + utc;\n            const est = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' })).toTimeString().split(' ')[0];\n            const pst = new Date(now.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' })).toTimeString().split(' ')[0];\n            const cet = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Berlin' })).toTimeString().split(' ')[0];\n            const jst = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' })).toTimeString().split(' ')[0];\n            const aest = new Date(now.toLocaleString('en-US', { timeZone: 'Australia/Sydney' })).toTimeString().split(' ')[0];\n            document.getElementById('est').textContent = 'EST: ' + est;\n            document.getElementById('pst').textContent = 'PST: ' + pst;\n            document.getElementById('cet').textContent = 'CET: ' + cet;\n            document.getElementById('jst').textContent = 'JST: ' + jst;\n            document.getElementById('aest').textContent = 'AEST: ' + aest;\n        }\n        setInterval(updateClocks, 1000);\n        updateClocks();\n    </script>\n</body>\n</html>
